name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: teaching
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: teaching_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teaching -d teaching_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TA_DATABASE_URL: postgresql+asyncpg://teaching:test-only-password@127.0.0.1:5432/teaching_test
      TA_TEST_DATABASE_URL: postgresql+asyncpg://teaching:test-only-password@127.0.0.1:5432/teaching_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.12.9
      - run: uv sync --frozen
      - run: uv run --frozen ruff check backend
      - run: uv run --frozen ruff format --check backend
      - run: uv run --frozen alembic upgrade head
      - run: uv run --frozen alembic check
      - run: uv run --frozen pytest -q

  browser:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: teaching
          POSTGRES_PASSWORD: e2e-only-password
          POSTGRES_DB: teaching_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teaching -d teaching_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TA_DATABASE_URL: postgresql+asyncpg://teaching:e2e-only-password@127.0.0.1:5432/teaching_e2e_test
      TA_DEV_API_TOKEN: ci-e2e-only-development-token
      TA_E2E_TOKEN: ci-e2e-only-development-token
      TA_EVALUATOR: fake-v1
      TA_E2E_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/e2e/package-lock.json
      - run: python -m pip install uv==0.12.9
      - run: uv sync --frozen
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm ci --no-audit --no-fund
        working-directory: frontend/e2e
      - run: npx --no-install playwright-core install --with-deps chromium
        working-directory: frontend/e2e
      - run: uv run --frozen alembic upgrade head
      - run: uv run --frozen teaching-assistant bootstrap
      - name: Run one isolated browser workflow with the simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/e2e
          .venv/bin/uvicorn teaching_assistant.api:create_app --factory --host 127.0.0.1 --port 8000 > .local/e2e/api.log 2>&1 &
          api_pid=$!
          .venv/bin/teaching-assistant worker > .local/e2e/worker.log 2>&1 &
          worker_pid=$!
          .venv/bin/teaching-assistant agent-worker > .local/e2e/agent-worker.log 2>&1 &
          agent_pid=$!
          (cd frontend && exec node node_modules/vite/bin/vite.js --host 127.0.0.1) > .local/e2e/frontend.log 2>&1 &
          frontend_pid=$!
          trap 'kill "$api_pid" "$worker_pid" "$agent_pid" "$frontend_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..60}; do
            if ! kill -0 "$api_pid" "$worker_pid" "$agent_pid" "$frontend_pid" 2>/dev/null; then
              echo "A service stopped before becoming ready; see the saved service logs."
              exit 1
            fi
            if curl --silent --fail --connect-timeout 1 --max-time 2 http://127.0.0.1:5173/health > /dev/null && curl --silent --fail --connect-timeout 1 --max-time 2 http://127.0.0.1:5173/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Services did not become ready after 60 bounded attempts."
            exit 1
          fi
          npm --prefix frontend/e2e test 2>&1 | tee .local/e2e/test-output.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/e2e/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
